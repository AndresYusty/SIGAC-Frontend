<section class="auth-screen">
  <div class="auth-hero">
    <div class="auth-brand">
      <span class="logo-plate">
        <img src="/USCO_Logo.png" [alt]="'app.logoAlt' | t" />
      </span>
      <div>
        <h1>{{ 'app.university' | t }}</h1>
        <small>{{ 'app.accreditation' | t }}</small>
      </div>
    </div>
    <div class="auth-copy">
      <h2>SIGAC</h2>
      <p>{{ 'login.heroText' | t }}</p>
    </div>
    <p class="auth-legal">{{ 'app.location' | t }}</p>
  </div>
  <div class="auth-panel">
    <app-lang-switch />
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <p class="kicker">{{ 'login.kicker' | t }}</p>
      <span class="logo-plate">
        <img class="auth-card-logo" src="/USCO_Logo.png" [alt]="'app.university' | t" />
      </span>
      <h2>{{ 'login.title' | t }}</h2>
      <p class="lead">{{ 'login.lead' | t }}</p>
      <div class="field">
        <label for="email">{{ 'common.email' | t }}</label>
        <input id="email" type="email" formControlName="email" autocomplete="username" />
      </div>
      <div class="field" style="margin-top: 0.8rem">
        <label for="password">{{ 'common.password' | t }}</label>
        <div class="password-field">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            class="password-toggle"
            type="button"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="(showPassword() ? 'common.hidePassword' : 'common.showPassword') | t"
            [attr.title]="(showPassword() ? 'common.hidePassword' : 'common.showPassword') | t"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>
      @if (error()) {
        <p class="error-text" style="margin-top: 0.8rem">{{ error() }}</p>
      }
      <button class="btn" style="margin-top: 1.1rem; width: 100%" type="submit" [disabled]="loading()">
        {{ (loading() ? 'login.submitting' : 'login.submit') | t }}
      </button>
      <div class="auth-links">
        <a routerLink="/forgot-password">{{ 'login.forgot' | t }}</a>
      </div>
    </form>
  </div>
</section>
