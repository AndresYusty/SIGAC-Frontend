<div class="page-head">
  <div>
    <p class="kicker">Sistema</p>
    <h1>Configuración</h1>
    <p class="lead">Tipos de consejo y parámetros globales.</p>
  </div>
</div>
<div class="grid grid-2">
  <article class="card">
    <h2>Tipos de consejo</h2>
    @for (t of tipos(); track t.id) {
      <div class="toolbar">
        <label class="field"><span>Código</span><input [(ngModel)]="t.codigo" /></label>
        <label class="field grow"><span>Nombre</span><input [(ngModel)]="t.nombre" /></label>
        <button class="btn btn-ghost" type="button" (click)="guardarTipo(t)">Guardar</button>
      </div>
    }
    <div class="toolbar">
      <label class="field"><span>Código</span><input [(ngModel)]="codigo" maxlength="10" /></label>
      <label class="field grow"><span>Nombre</span><input [(ngModel)]="nombre" /></label>
      <button class="btn" type="button" (click)="crearTipo()">Agregar</button>
    </div>
  </article>
  <article class="card">
    <h2>Parámetros</h2>
    @for (p of params(); track p.clave) {
      <div class="toolbar">
        <label class="field grow">
          <span>{{ p.clave }}</span>
          <input [(ngModel)]="p.valor" />
          <small class="muted">{{ p.descripcion }}</small>
        </label>
        <button class="btn btn-ghost" type="button" (click)="guardarParam(p)">Guardar</button>
      </div>
    }
  </article>
</div>
