<section class="auth-screen">
  <div class="auth-hero">
    <div class="auth-brand">
      <span class="logo-plate">
        <img src="/USCO_Logo.png" alt="Escudo Universidad Surcolombiana" />
      </span>
      <div>
        <h1>Universidad Surcolombiana</h1>
        <small>SIGAC</small>
      </div>
    </div>
    <div class="auth-copy">
      <h2>Nueva contraseña</h2>
      <p>Mínimo 8 caracteres, con letras y números.</p>
    </div>
    <p class="auth-legal">Vigilada Mineducación</p>
  </div>
  <div class="auth-panel">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <p class="kicker">Seguridad</p>
      <h2>Restablecer contraseña</h2>
      <div class="field">
        <label for="clave">Nueva contraseña</label>
        <div class="password-field">
          <input
            id="clave"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="nuevaClave"
          />
          <button
            class="password-toggle"
            type="button"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.title]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>
      @if (error()) { <p class="error-text" style="margin-top: 0.8rem">{{ error() }}</p> }
      @if (ok()) { <p class="lead" style="margin-top: 0.8rem">{{ ok() }}</p> }
      <button class="btn" style="margin-top: 1.1rem; width: 100%" type="submit" [disabled]="loading()">Guardar</button>
      <div class="auth-links"><a routerLink="/login">Ir al ingreso</a></div>
    </form>
  </div>
</section>
