<section class="auth-screen">
  <div class="auth-hero">
    <div class="auth-brand">
      <span class="logo-plate">
        <img src="/USCO_Logo.png" [alt]="'app.logoAlt' | t" />
      </span>
      <div>
        <h1>{{ 'app.university' | t }}</h1>
        <small>SIGAC</small>
      </div>
    </div>
    <div class="auth-copy">
      <h2>{{ 'forgot.heroTitle' | t }}</h2>
      <p>{{ 'forgot.heroText' | t }}</p>
    </div>
    <p class="auth-legal">{{ 'app.accreditation' | t }}</p>
  </div>
  <div class="auth-panel">
    <app-lang-switch />
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <p class="kicker">{{ 'forgot.kicker' | t }}</p>
      <h2>{{ 'forgot.title' | t }}</h2>
      <div class="field">
        <label for="email">{{ 'common.email' | t }}</label>
        <input id="email" type="email" formControlName="email" />
      </div>
      @if (error()) { <p class="error-text" style="margin-top: 0.8rem">{{ error() }}</p> }
      @if (success()) { <p class="lead" style="margin-top: 0.8rem">{{ success() }}</p> }
      <button class="btn" style="margin-top: 1.1rem; width: 100%" type="submit" [disabled]="loading()">{{ 'forgot.submit' | t }}</button>
      <div class="auth-links"><a routerLink="/login">{{ 'forgot.back' | t }}</a></div>
    </form>
  </div>
</section>
