<section class="auth-screen">
  <div class="auth-hero">
    <div class="auth-brand">
      <span class="logo-plate">
        <img src="/USCO_Logo.png" alt="Escudo Universidad Surcolombiana" />
      </span>
      <div>
        <h1>Universidad Surcolombiana</h1>
        <small>SIGAC</small>
      </div>
    </div>
    <div class="auth-copy">
      <h2>Recuperar acceso</h2>
      <p>Se enviará un enlace de restablecimiento al correo registrado, si la cuenta existe y está activa.</p>
    </div>
    <p class="auth-legal">Vigilada Mineducación</p>
  </div>
  <div class="auth-panel">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <p class="kicker">Cuenta</p>
      <h2>Olvidé mi contraseña</h2>
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" type="email" formControlName="email" />
      </div>
      @if (error()) { <p class="error-text" style="margin-top: 0.8rem">{{ error() }}</p> }
      @if (ok()) { <p class="lead" style="margin-top: 0.8rem">{{ ok() }}</p> }
      <button class="btn" style="margin-top: 1.1rem; width: 100%" type="submit" [disabled]="loading()">Enviar enlace</button>
      <div class="auth-links"><a routerLink="/login">Volver al ingreso</a></div>
    </form>
  </div>
</section>
